# Netlify publica esta carpeta tal cual, sin compilar nada.
# Las funciones de netlify/edge-functions ponen la vista previa
# (foto y precio) de cada consola al compartir el enlace.
[build]
  publish = "."
  command = ""
  edge_functions = "netlify/edge-functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
